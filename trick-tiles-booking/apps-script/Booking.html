<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090d18;color:#edf5ff;font-family:'Noto Sans TC',sans-serif;background-image:linear-gradient(rgba(30,45,75,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(30,45,75,.35) 1px,transparent 1px);background-size:42px 42px}.shell{width:min(680px,calc(100% - 32px));margin:0 auto;padding:48px 0 70px}.brand{font:700 23px 'Chakra Petch';letter-spacing:1px;color:#00f09a;text-decoration:none}.brand b{color:#ff3d62}.eyebrow{font:700 13px 'Chakra Petch';letter-spacing:2px;color:#ff3d62;margin-top:36px}.title{font:700 clamp(34px,7vw,54px)/1.08 'Chakra Petch';margin:10px 0}.sub{color:#a4b0c7;margin:0 0 28px}.panel{background:rgba(17,25,43,.94);border:1px solid #27324b;border-radius:20px;padding:26px;box-shadow:0 16px 50px rgba(0,0,0,.25)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.field.full{grid-column:1/-1}label{display:block;margin-bottom:7px;font-size:14px;font-weight:700}input,select{display:block;width:100%;min-height:47px;padding:10px 12px;border-radius:10px;color:#edf5ff;background:#0c1425;border:1px solid #394762;font:inherit}input:focus,select:focus{outline:2px solid #00f09a;border-color:#00f09a}button{width:100%;border:0;border-radius:11px;min-height:50px;background:#00f09a;color:#05110d;font:900 16px 'Noto Sans TC';cursor:pointer;box-shadow:0 0 24px rgba(0,240,154,.2)}button:disabled{cursor:wait;opacity:.65}.hint{color:#a4b0c7;font-size:13px;margin:7px 0 0}.error{display:none;margin:0 0 16px;padding:12px;border-radius:10px;border:1px solid #ff3d62;color:#ffd7df;background:rgba(255,61,98,.12);font-size:14px}.hide{display:none}.transfer{display:grid;gap:0;margin:20px 0;border:1px solid #394762;border-radius:12px;overflow:hidden}.transfer div{padding:13px 15px;border-bottom:1px solid #394762}.transfer div:last-child{border:0}.transfer span{color:#a4b0c7;font-size:13px;display:block}.transfer strong{font-size:18px;letter-spacing:.4px}.timer{color:#ffe05b;font-weight:700}.summary{border-radius:12px;padding:16px;background:#0c1425;color:#dce7fa;font-size:14px;line-height:1.85}.complete{text-align:center}.check{font-size:58px;color:#00f09a;line-height:1}.complete h2{font:700 32px 'Chakra Petch';margin:13px 0 8px}.complete p{color:#a4b0c7}@media(max-width:540px){.shell{padding-top:32px}.panel{padding:19px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main class="shell"><a class="brand" href="https://twins030507-sys.github.io/ddmischief/">TRICK<b>TILES</b></a><div class="eyebrow">ONLINE BOOKING</div><h1 class="title" id="pageTitle">選擇你的挑戰時段</h1><p class="sub" id="pageSub">送出後，時段將為你保留一小時；付款確認後才完成預約。</p>
<section class="panel" id="bookingView"><div id="bookingError" class="error" role="alert"></div><form id="bookingForm"><div class="grid"><div class="field"><label for="name">預約大名</label><input id="name" maxlength="30" autocomplete="name" required placeholder="王小明"></div><div class="field"><label for="phone">手機號碼</label><input id="phone" inputmode="tel" autocomplete="tel" required placeholder="0912345678"></div><div class="field"><label for="date">預約日期</label><input id="date" type="date" required></div><div class="field"><label for="court">場地類型</label><select id="court" required><option value="">請選擇場地</option><option value="medium">中場（2–5 人）</option><option value="large">大場（2–10 人）</option></select></div><div class="field"><label for="players">遊玩人數</label><select id="players" required disabled><option value="">請先選擇場地</option></select></div><div class="field"><label for="slot">場次時段</label><select id="slot" required disabled><option value="">請先選擇日期與場地</option></select><p class="hint">顯示中的時段皆可選；送出時系統會再即時確認一次。</p></div></div><button id="holdButton" type="submit">確認送出預約申請</button></form></section>
<section class="panel hide" id="paymentView"><div id="paymentError" class="error" role="alert"></div><p class="timer" id="timer">此時段保留中</p><div class="summary" id="summary"></div><div class="transfer"><div><span>匯款帳號</span><strong id="account"></strong></div><div><span>匯款銀行</span><strong id="bank"></strong></div><div><span>戶名</span><strong id="accountName"></strong></div></div><p class="hint">請於一小時內完成匯款，逾時系統將自動取消此預約。</p><form id="paymentForm"><div class="field"><label for="last5">匯款帳號後五碼</label><input id="last5" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" required placeholder="12345"></div><button id="confirmButton" type="submit">送出並完成預約</button></form></section>
<section class="panel hide complete" id="completeView"><div class="check">✓</div><h2>預約完成！</h2><p>你的預約已建立並同步到場館日曆，該時段已鎖定。</p><div class="summary" id="completeSummary"></div></section></main>
<script>
const courtRules={medium:[2,5],large:[2,10]}; let hold=null,deadline=null,timerId=null;
const $=id=>document.getElementById(id); const setError=(id,msg)=>{const el=$(id);el.textContent=msg||'';el.style.display=msg?'block':'none'};
function todayTaipei(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date())}
$('date').min=todayTaipei();
function loading(button,yes){button.disabled=yes;button.textContent=yes?'處理中…':button.dataset.text}
function refreshPlayers(){const type=$('court').value, select=$('players');select.innerHTML='';if(!type){select.disabled=true;select.add(new Option('請先選擇場地',''));return}select.disabled=false;select.add(new Option('請選擇遊玩人數',''));const [min,max]=courtRules[type];for(let n=min;n<=max;n++)select.add(new Option(n+' 人',n));refreshSlots()}
function refreshSlots(){const date=$('date').value,court=$('court').value,select=$('slot');select.innerHTML='';if(!date||!court){select.disabled=true;select.add(new Option('請先選擇日期與場地',''));return}select.disabled=true;select.add(new Option('載入可預約時段…',''));google.script.run.withSuccessHandler(result=>{select.innerHTML='';const open=result.slots.filter(s=>s.available);if(!open.length){select.add(new Option('此日期已無可預約時段',''));return}select.add(new Option('請選擇時段',''));open.forEach(s=>select.add(new Option(s.label,s.value)));select.disabled=false}).withFailureHandler(showBookingFailure).getAvailability(date,court)}
function showBookingFailure(err){setError('bookingError',err.message||'無法取得時段，請稍後再試。');$('slot').innerHTML='';$('slot').add(new Option('暫時無法載入時段',''));}
$('court').addEventListener('change',refreshPlayers);$('date').addEventListener('change',refreshSlots);
$('bookingForm').addEventListener('submit',event=>{event.preventDefault();setError('bookingError','');const button=$('holdButton');loading(button,true);google.script.run.withSuccessHandler(result=>{loading(button,false);hold=result;deadline=new Date(result.expiresAt);$('account').textContent=result.transfer.account;$('bank').textContent=result.transfer.bank;$('accountName').textContent=result.transfer.accountName;$('summary').innerHTML=`<b>${escapeText($('name').value)}</b><br>${escapeText($('date').value)}　${escapeText($('slot').selectedOptions[0].text)}<br>${escapeText($('court').selectedOptions[0].text)}・${escapeText($('players').value)} 人`;$('bookingView').classList.add('hide');$('paymentView').classList.remove('hide');$('pageTitle').textContent='完成匯款，鎖定你的時段';$('pageSub').textContent='填寫匯款帳號後五碼後，系統會立即建立預約。';startTimer()}).withFailureHandler(err=>{loading(button,false);setError('bookingError',err.message||'建立預約保留失敗，請重試。');}).createHold({name:$('name').value,phone:$('phone').value.replace(/[\s-]/g,''),date:$('date').value,court:$('court').value,players:Number($('players').value),slot:$('slot').value})});
$('paymentForm').addEventListener('submit',event=>{event.preventDefault();setError('paymentError','');const button=$('confirmButton');loading(button,true);google.script.run.withSuccessHandler(result=>{loading(button,false);clearInterval(timerId);$('paymentView').classList.add('hide');$('completeView').classList.remove('hide');$('pageTitle').textContent='挑戰預約成功';$('pageSub').textContent='我們期待在搗蛋格子見到你。';const r=result.reservation;$('completeSummary').innerHTML=`<b>${escapeText(r.name)}</b><br>${escapeText(r.date)}　${escapeText(r.slot)}<br>${escapeText(r.court)}・${escapeText(r.players)} 人`;}).withFailureHandler(err=>{loading(button,false);setError('paymentError',err.message||'確認失敗，請確認保留時間或重新預約。');}).confirmPayment({id:hold.id,last5:$('last5').value})});
function startTimer(){timerId=setInterval(()=>{const ms=deadline-new Date();if(ms<=0){clearInterval(timerId);$('timer').textContent='保留時間已結束，請重新選擇時段。';$('confirmButton').disabled=true;return}const min=Math.floor(ms/60000),sec=Math.floor(ms/1000)%60;$('timer').textContent=`此時段保留中，剩餘 ${min}:${String(sec).padStart(2,'0')}`},500)}
function escapeText(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
document.querySelectorAll('button').forEach(b=>b.dataset.text=b.textContent);
</script></body></html>
